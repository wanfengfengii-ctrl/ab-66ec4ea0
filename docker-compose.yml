# 彩窗铅条骨架编排
#  - web：静态页面服务，端口由环境变量 WEB_PORT 配置（默认 8080），
#         镜像内置 /healthz 静态健康检查。
#  - verify：一次性服务，自行执行代码测试、构建与骨架样例冒烟，
#           以退出码报告结果（通过后退出 0）。
services:
  web:
    build: .
    image: stained-glass-lead-web
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      # 宿主机同端口暴露页面，可用 WEB_PORT=xxxx docker compose up 覆盖
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${WEB_PORT}/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  verify:
    build: .
    image: stained-glass-lead-web
    depends_on:
      web:
        condition: service_healthy
    environment:
      SMOKE_TARGET: "http://web:${WEB_PORT:-8080}"
    # 一次性：测试 -> 构建 -> 对已就绪 web 服务与样例骨架冒烟；失败即非零退出
    command: ["sh", "-c", "npm run test && npm run build && npm run smoke"]
    restart: "no"
